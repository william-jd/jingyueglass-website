<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 450" width="600" height="450">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc"/>
      <stop offset="100%" stop-color="#f1f5f9"/>
    </linearGradient>
    <linearGradient id="glassGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#1a3a5c" stop-opacity="0.15"/>
      <stop offset="50%" stop-color="#1a3a5c" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#1a3a5c" stop-opacity="0.15"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c8930a"/>
      <stop offset="100%" stop-color="#e0a70b"/>
    </linearGradient>
  </defs>
  
  <rect width="600" height="450" fill="url(#bg)"/>
  
  <!-- Grid Accent Lines -->
  <line x1="50" y1="225" x2="550" y2="225" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  <line x1="300" y1="40" x2="300" y2="410" stroke="#e2e8f0" stroke-width="1" stroke-dasharray="4,4"/>
  
  <!-- Outer Double Wall Outline -->
  <path d="M 230 110 Q 220 280 250 330 Q 270 350 300 350 Q 330 350 350 330 Q 380 280 370 110 Z" fill="url(#glassGrad)" stroke="#1a3a5c" stroke-width="3" stroke-linejoin="round"/>
  
  <!-- Inner Wall Outline -->
  <path d="M 245 125 Q 238 260 262 305 Q 278 322 300 322 Q 322 322 338 305 Q 362 260 355 125 Z" fill="#ffffff" stroke="#c8930a" stroke-width="2.5" stroke-dasharray="6,3"/>
  
  <!-- Rim Lip -->
  <ellipse cx="300" cy="110" rx="70" ry="12" fill="none" stroke="#1a3a5c" stroke-width="3"/>
  <ellipse cx="300" cy="110" rx="55" ry="9" fill="none" stroke="#c8930a" stroke-width="2"/>
  
  <!-- Base Vent Dot with Silicone Plug -->
  <circle cx="300" cy="350" r="4.5" fill="#c8930a"/>
  
  <!-- Model & Specification Labels -->
  <rect x="180" y="375" width="240" height="34" rx="17" fill="#0d2540"/>
  <text x="300" y="397" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="13" font-weight="700" fill="#fef08a" text-anchor="middle" letter-spacing="1">MODEL XZS-2658 · 250ML</text>
  
  <text x="300" y="55" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="600" fill="#64748b" text-anchor="middle" letter-spacing="0.5">BOROSILICATE DOUBLE WALL GLASS</text>
</svg>