<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>晶悦达 · 报价工作台</title><link rel="stylesheet" href="style.css"></head><body>
<header class="top"><div class="brand"><b>JY</b><div>晶悦达 <span>JINGYUEDA</span></div><em>报价工作台</em></div><div class="actions"><span id="saveState">本机草稿</span><button id="save">保存草稿</button><button id="load">导入草稿</button><button id="excel">导出 Excel</button><button id="print" class="primary">保存 PDF</button></div></header>
<main><aside><div class="eyebrow">PRODUCT LIBRARY</div><h1>从产品开始</h1><p class="muted">选入产品，自动填写报价信息。</p><input id="search" type="search" placeholder="搜索货号、产品名称…" aria-label="搜索产品"><div class="filters"><button class="active" data-category="">全部</button><button data-category="木盒套装">木盒套装</button><button data-category="现货杯具">现货杯具</button></div><div class="library-meta"><span id="resultCount"></span><button id="catalogBtn" class="link">查看图册 ↗</button></div><div id="products"></div></aside>
<section class="workspace"><div class="workspace-heading"><div><div class="eyebrow">QUOTATION STUDIO</div><h2>制作报价单</h2></div><button id="new">新建空白报价</button></div><div class="notice">价格暂留空 · 公司资料及条款来自模板 · 草稿仅保存在当前浏览器</div>
<section class="panel"><div class="section-title"><h3>01 <span>客户与报价信息</span></h3><button id="detailsBtn" class="link">公司资料及交易条款</button></div><div id="fields" class="fields"></div></section>
<section class="panel"><div class="section-title"><h3>02 <span>已选产品</span> <small id="selectedCount"></small></h3><span class="muted">点击“编辑”核对规格与目录图片</span></div><div id="selected"></div></section>
<div class="section-title preview-heading"><h3>03 <span>报价单预览</span></h3><span class="muted">A4 横向 · PDF 直接下载，不含浏览器页眉页脚</span></div><div class="paper-scroll"><article id="paper"></article></div></section></main>
<dialog id="editDialog"><div class="dialog-head"><h2 id="editTitle">编辑产品</h2><button data-close="editDialog">关闭</button></div><div id="editBody"></div><div class="dialog-foot"><button id="applyEdit" class="primary">应用到报价单</button></div></dialog>
<dialog id="settingsDialog"><div class="dialog-head"><h2>公司资料及交易条款</h2><button data-close="settingsDialog">关闭</button></div><p class="muted">已沿用报价模板。模板交期为 30 天，产品表现货交期为 1–7 个工作日，请按订单实际情况调整。</p><div id="settingsFields" class="fields"></div><div class="dialog-foot"><button id="applySettings" class="primary">保存资料</button></div></dialog>
<dialog id="catalogDialog"><div class="dialog-head"><h2>产品目录</h2><button data-close="catalogDialog">关闭</button></div><div class="catalog-toolbar"><label>PDF 页码 <select id="pageSelect"></select></label><span id="cropHelp">浏览原目录</span><button id="useCrop" class="primary" hidden>使用选区图片</button></div><div class="canvas-wrap"><canvas id="catalogCanvas"></canvas></div></dialog>
<input type="file" id="importFile" accept="application/json,.json" hidden><div id="toast" role="status"></div>
<script src="vendor/jszip.min.js"></script><script src="vendor/pdf-lib.min.js"></script><script src="data.js"></script><script src="app.js"></script><script src="export.js"></script><script src="vendor/pdf-runtime.js"></script><script src="import.js"></script><script src="template.js"></script></body></html>
